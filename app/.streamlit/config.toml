# Dark theme, matching the thumbnail and the Carto dark basemap. The light
# variant was tried and looked washed out against the map.

[theme]
base = "dark"
primaryColor = "#e07a2c"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2b"
textColor = "#e8edf5"
font = "sans serif"

[browser]
gatherUsageStats = false
